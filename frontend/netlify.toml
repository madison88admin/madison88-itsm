[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  CI = "false"

[functions]
  directory = "../netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/proxy-api?path=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
