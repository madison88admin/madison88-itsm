# ============================================================
# Madison88 ITSM — Nginx Reverse Proxy Config
# Place at: /etc/nginx/sites-available/madison88-itsm
#
# Change upstream port to match your NODE_PORT in backend/.env
# ============================================================

upstream node_backend {
    server 127.0.0.1:3001;   # ← Node.js backend port
    keepalive 32;
}

server {
    listen 80;
    server_name _;            # ← Replace with your domain when ready

    client_max_body_size 50m;

    # ---- API endpoints ----
    location /api/ {
        proxy_pass http://node_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout  90s;
        proxy_send_timeout  90s;
    }

    # ---- Socket.io (WebSocket upgrade) ----
    location /socket.io/ {
        proxy_pass http://node_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  86400s;   # keep WS alive for 24h
        proxy_send_timeout  86400s;
    }

    # ---- Health check ----
    location /health {
        proxy_pass http://node_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ---- Deny everything else ----
    location / {
        return 404;
    }
}
